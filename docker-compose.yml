# Databases for running the full suite against a real engine.
#
#   docker compose up -d mysql postgres sqlserver
#   DB_DRIVER=pdo_mysql  DB_PORT=3310 DB_USER=root     DB_PASSWORD=secret composer test
#   DB_DRIVER=pdo_pgsql  DB_PORT=5436 DB_USER=postgres DB_PASSWORD=secret composer test
#   DB_DRIVER=pdo_sqlsrv DB_PORT=1437 DB_USER=sa       DB_PASSWORD='Secret_1234' composer test
#
# Ports are shifted off the defaults, and off the ports json-api (3307/5433/
# 1434), appkit (3308/5434/1435) and panel (3309/5435/1436) use, so all four
# suites can run side by side. SQLite needs nothing and stays the default.
services:
  mysql:
    image: mysql:8.4
    ports: ['3310:3306']
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: media_test
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-psecret']
      interval: 5s
      retries: 20

  postgres:
    image: postgres:16
    ports: ['5436:5432']
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: media_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ['1437:1433']
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Secret_1234'
      MSSQL_PID: Developer
