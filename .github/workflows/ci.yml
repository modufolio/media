name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# modufolio/appkit is a composer path repository (../appkit), so both repos are
# checked out side by side inside the workspace and every job runs from media/.
defaults:
  run:
    working-directory: media

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout media
        uses: actions/checkout@v6
        with:
          path: media

      - name: Checkout appkit (path dependency)
        uses: actions/checkout@v6
        with:
          repository: modufolio/appkit
          path: appkit

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, exif, fileinfo, gd, intl, libxml, pdo, pdo_sqlite, simplexml, sqlite3, zip

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: composer test

  databases:
    name: Test suite on ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4
            driver: pdo_mysql
            extensions: pdo_mysql
            port: 3306
            user: root
            password: secret
          - name: PostgreSQL 16
            driver: pdo_pgsql
            extensions: pdo_pgsql
            port: 5432
            user: postgres
            password: secret
          - name: SQL Server 2022
            driver: pdo_sqlsrv
            extensions: sqlsrv, pdo_sqlsrv
            port: 1433
            user: sa
            password: Secret_1234

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: media_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: media_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Secret_1234
          MSSQL_PID: Developer
        ports: ['1433:1433']
        # Readiness is polled from the runner below, against the client this
        # job actually uses, rather than through a healthcheck whose tool
        # path inside the image has already moved once.

    steps:
      - name: Checkout media
        uses: actions/checkout@v6
        with:
          path: media

      - name: Checkout appkit (path dependency)
        uses: actions/checkout@v6
        with:
          repository: modufolio/appkit
          path: appkit

      # The sqlsrv extension is a shim over Microsoft's ODBC driver, which the
      # runner image no longer ships. It has to be installed before setup-php,
      # which needs the unixODBC headers to build the extension.
      - name: Install the Microsoft ODBC driver
        if: matrix.driver == 'pdo_sqlsrv'
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, exif, fileinfo, gd, intl, libxml, pdo, pdo_sqlite, simplexml, sqlite3, zip, ${{ matrix.extensions }}

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      # The SQL Server image has no MSSQL_DATABASE equivalent, so the database
      # the suite connects to is created here. -C trusts the container's
      # self-signed certificate, which driver 18 requires by default.
      - name: Wait for SQL Server and create the database
        if: matrix.driver == 'pdo_sqlsrv'
        run: |
          for i in $(seq 1 30); do
            if /opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1,1433 -U sa -P 'Secret_1234' -Q "IF DB_ID('media_test') IS NULL CREATE DATABASE media_test" >/dev/null 2>&1; then
              echo "SQL Server is up after ${i} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server did not become reachable within 150s." >&2
          exit 1

      - name: Run the test suite against ${{ matrix.name }}
        env:
          DB_DRIVER: ${{ matrix.driver }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_NAME: media_test
          DB_USER: ${{ matrix.user }}
          DB_PASSWORD: ${{ matrix.password }}
        run: composer test

  phpstan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout media
        uses: actions/checkout@v6
        with:
          path: media

      - name: Checkout appkit (path dependency)
        uses: actions/checkout@v6
        with:
          repository: modufolio/appkit
          path: appkit

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, exif, fileinfo, gd, intl, libxml, pdo, pdo_sqlite, simplexml, sqlite3, zip

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan
        run: composer stan
